# Build NEXUS AI Android APK with Flet

name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "main.py"
      - "pyproject.toml"
      - "requirements-app.txt"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          python -m pip install -U pip
          pip install -r requirements-app.txt
          pip install flet-cli

      - name: Build APK
        run: |
          flet build apk . \
            --product "NEXUS AI" \
            --org com.nexusai \
            --project nexus-ai \
            --build-version 1.0.0 \
            --build-number ${{ github.run_number }} \
            --module-name main \
            --exclude .venv backend tests data server scripts __pycache__ .git .github \
            --yes \
            --permissions microphone \
            -o build/apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-apk
          path: |
            build/apk/**/*.apk
            build/**/*.apk
          if-no-files-found: error
